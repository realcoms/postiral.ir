<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Postiral | به‌زودی</title>

    <meta name="description" content="وب‌سایت Postiral به‌زودی راه‌اندازی می‌شود.">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Tahoma, Arial, sans-serif;

            background: #f7f8fa;
            color: #1c1c1c;

            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 40px 25px;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .badge {
            display: inline-block;

            padding: 8px 18px;

            border-radius: 50px;

            background: #111827;
            color: #ffffff;

            font-size: 14px;

            margin-bottom: 25px;
        }

        h1 {
            font-size: 48px;
            line-height: 1.4;

            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 2;

            color: #666;

            margin-bottom: 30px;
        }

        .line {
            width: 70px;
            height: 4px;

            margin: 0 auto;

            border-radius: 10px;

            background: #111827;
        }

        @media (max-width: 600px) {

            .logo {
                font-size: 32px;
            }

            h1 {
                font-size: 34px;
            }

            p {
                font-size: 16px;
            }

        }

    </style>

</head>

<body>

    <main class="container">

        <div class="logo">
            Postiral
        </div>

        <div class="badge">
            به‌زودی
        </div>

        <h1>
            در حال آماده‌سازی هستیم
        </h1>

        <p>
            وب‌سایت Postiral به‌زودی راه‌اندازی می‌شود.
            برای یک تجربه متفاوت آماده باشید.
        </p>

        <div class="line"></div>

    </main>

</body>

</html>
