<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071B3B">
<meta name="description" content="پستیرال — به‌زودی">
<title>پستیرال | به‌زودی</title>

<!-- IranYekan: the page remains a single HTML file; only the licensed webfont is loaded remotely. -->
<style>
@import url('https://fonts.cdnfonts.com/css/iranyekan');

:root{
  --navy:#071B3B;
  --navy-deep:#041127;
  --blue:#0A2D6D;
  --blue2:#164D9C;
  --teal:#00A8A6;
  --teal-soft:#72E4DF;
  --cyan:#C6F0EE;
  --gold:#F2B24C;
  --white:#F8FBFF;
  --muted:#AEBED5;
  --line:rgba(198,240,238,.18);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:'IRANYekan',Tahoma,sans-serif}
body{overflow:hidden;background:var(--navy-deep);color:var(--white)}
button,input{font:inherit}

.page{
  position:relative;
  width:100vw;height:100svh;
  min-height:560px;
  overflow:hidden;
  isolation:isolate;
  display:grid;
  place-items:center;
  background:
    radial-gradient(700px 500px at 12% 12%,rgba(0,168,166,.16),transparent 65%),
    radial-gradient(650px 520px at 92% 88%,rgba(22,77,156,.34),transparent 68%),
    linear-gradient(125deg,#041127 0%,#071B3B 48%,#0A2D6D 100%);
}

/* Animated brand waves */
.waves{
  position:absolute;inset:-12%;
  z-index:-4;pointer-events:none;
  opacity:.65;
}
.wave{
  position:absolute;
  width:75vw;height:75vw;
  min-width:700px;min-height:700px;
  border:1px solid rgba(0,168,166,.13);
  border-radius:48% 52% 58% 42%;
  transform:rotate(25deg);
  filter:blur(.1px);
}
.wave:nth-child(1){right:-23%;top:-32%;animation:waveMove 18s ease-in-out infinite}
.wave:nth-child(2){left:-32%;bottom:-45%;border-color:rgba(198,240,238,.09);animation:waveMove 23s 2s ease-in-out infinite reverse}
.wave:nth-child(3){right:10%;bottom:-58%;border-color:rgba(242,178,76,.055);animation:waveMove 27s 4s ease-in-out infinite}

.grid{
  position:absolute;inset:0;z-index:-3;pointer-events:none;opacity:.07;
  background-image:
    linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
  background-size:70px 70px;
  mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);
}

.halo{
  position:absolute;border-radius:50%;pointer-events:none;z-index:-2;
  filter:blur(18px);
}
.halo.one{width:360px;height:360px;left:-170px;top:-160px;background:rgba(0,168,166,.13);animation:halo1 10s ease-in-out infinite}
.halo.two{width:420px;height:420px;right:-200px;bottom:-210px;background:rgba(22,77,156,.25);animation:halo2 13s ease-in-out infinite}
.halo.three{width:220px;height:220px;left:44%;top:5%;background:rgba(0,168,166,.05);animation:halo3 8s ease-in-out infinite}

/* Delivery route */
.route{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  opacity:.65;
}
.route svg{width:100%;height:100%}
.route .route-line{
  fill:none;
  stroke:rgba(0,168,166,.28);
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-dasharray:5 12;
  animation:dash 15s linear infinite;
}
.route .route-line.back{
  stroke:rgba(198,240,238,.11);
  stroke-width:1;
  stroke-dasharray:3 15;
  animation-duration:22s;
}
.pin{
  fill:var(--teal);
  filter:drop-shadow(0 0 8px rgba(0,168,166,.7));
}
.pin.alt{fill:var(--gold);filter:drop-shadow(0 0 8px rgba(242,178,76,.45))}
.route-dot{fill:#D9FFFF;animation:pinPulse 2.5s ease-in-out infinite}

/* Animated parcel travelling on the route */
.parcel{
  position:absolute;z-index:2;left:50%;top:50%;
  width:34px;height:34px;
  transform:translate(-50%,-50%);
  animation:parcelTravel 11s linear infinite;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.25));
}
.parcel svg{width:100%;height:100%}
.parcel path{fill:var(--teal)}
.parcel .box{fill:#0E377D}
.parcel .tape{fill:var(--cyan)}
.parcel .shine{fill:rgba(255,255,255,.65)}

/* Floating delivery icons */
.float-icon{
  position:absolute;z-index:1;pointer-events:none;
  width:44px;height:44px;opacity:.16;
  color:var(--cyan);
  animation:floatIcon 9s ease-in-out infinite;
}
.float-icon svg{width:100%;height:100%}
.fi1{left:9%;top:23%;animation-delay:-2s}
.fi2{right:10%;top:18%;animation-delay:-5s}
.fi3{left:13%;bottom:18%;animation-delay:-7s}
.fi4{right:15%;bottom:23%;animation-delay:-3s}
.fi5{right:29%;top:13%;width:32px;height:32px;opacity:.10;animation-delay:-6s}

.particles{position:absolute;inset:0;z-index:1;pointer-events:none}
.particle{
  position:absolute;width:var(--s);height:var(--s);
  left:var(--x);top:var(--y);border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 14px rgba(0,168,166,.75);
  opacity:.45;
  animation:particle var(--d) ease-in-out infinite;
  animation-delay:var(--delay);
}
.particle.gold{background:var(--gold);box-shadow:0 0 14px rgba(242,178,76,.45)}

/* Main glass frame */
.frame{
  position:relative;
  z-index:10;
  width:min(850px,91vw);
  min-height:500px;
  padding:clamp(32px,5vw,62px) clamp(22px,6vw,72px);
  border:1px solid rgba(198,240,238,.20);
  border-radius:30px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035)),
    rgba(4,17,39,.30);
  box-shadow:
    0 35px 100px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.13),
    inset 0 0 0 1px rgba(0,168,166,.035);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  text-align:center;
  transform:translate3d(var(--mx,0),var(--my,0),0);
  transition:transform .18s ease-out;
}
.frame:before{
  content:"";
  position:absolute;inset:9px;
  border:1px solid rgba(255,255,255,.045);
  border-radius:22px;
  pointer-events:none;
}
.frame:after{
  content:"";
  position:absolute;
  width:160px;height:3px;
  left:50%;top:0;
  transform:translateX(-50%);
  border-radius:999px;
  background:linear-gradient(90deg,transparent,var(--teal),transparent);
  box-shadow:0 0 24px rgba(0,168,166,.55);
}

/* Logo is intentionally compact and separated from the background */
.logo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  width:fit-content;
  max-width:100%;
  margin:0 auto 24px;
  padding:13px 25px;
  border-radius:18px;
  background:rgba(255,255,255,.97);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 16px 40px rgba(0,0,0,.20);
  animation:logoIn .9s cubic-bezier(.16,1,.3,1) both;
}
.logo{
  display:block;
  width:min(300px,62vw);
  height:auto;
  max-height:88px;
  object-fit:contain;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:8px 14px;
  border:1px solid rgba(0,168,166,.22);
  border-radius:999px;
  color:#DDFDFC;
  background:rgba(0,168,166,.065);
  font-size:12px;
  font-weight:600;
  animation:rise .8s .16s both;
}
.badge .live{
  width:7px;height:7px;border-radius:50%;
  background:#2DE4DB;
  box-shadow:0 0 0 5px rgba(0,168,166,.11),0 0 15px rgba(0,168,166,.9);
  animation:live 1.8s ease-in-out infinite;
}

h1{
  margin:21px 0 0;
  font-size:clamp(48px,7.5vw,82px);
  line-height:1.05;
  font-weight:900;
  letter-spacing:-.035em;
  color:#fff;
  text-shadow:0 12px 38px rgba(0,0,0,.22);
  animation:rise .9s .28s both;
}
h1 em{
  font-style:normal;
  color:var(--teal-soft);
}
.lead{
  max-width:570px;
  margin:18px auto 0;
  color:rgba(235,247,255,.72);
  font-size:clamp(14px,1.7vw,17px);
  font-weight:400;
  line-height:2.15;
  animation:rise .9s .40s both;
}

.services{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:27px;
  animation:rise .9s .52s both;
}
.service{
  display:flex;align-items:center;gap:8px;
  padding:9px 13px;
  border:1px solid rgba(198,240,238,.12);
  border-radius:13px;
  color:rgba(235,247,255,.76);
  background:rgba(255,255,255,.035);
  font-size:11px;
}
.service svg{width:18px;height:18px;color:var(--teal-soft)}

.bottom-line{
  position:absolute;
  left:50%;bottom:22px;
  transform:translateX(-50%);
  z-index:11;
  color:rgba(220,237,255,.38);
  font-size:10px;
  white-space:nowrap;
}
.bottom-line b{color:rgba(0,168,166,.8)}

.cursor-ring,.cursor-dot{
  position:fixed;z-index:30;pointer-events:none;
  transform:translate(-50%,-50%);
}
.cursor-ring{
  width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(198,240,238,.38);
  transition:width .18s,height .18s,border-color .18s;
}
.cursor-dot{
  width:4px;height:4px;border-radius:50%;
  background:var(--teal);
  box-shadow:0 0 15px var(--teal);
}

/* Animations */
@keyframes waveMove{
  0%,100%{transform:rotate(25deg) translate(0,0) scale(1)}
  50%{transform:rotate(32deg) translate(-25px,22px) scale(1.035)}
}
@keyframes halo1{50%{transform:translate(90px,70px) scale(1.15)}}
@keyframes halo2{50%{transform:translate(-70px,-55px) scale(.9)}}
@keyframes halo3{50%{transform:translate(25px,45px) scale(1.2)}}
@keyframes dash{to{stroke-dashoffset:-500}}
@keyframes pinPulse{50%{opacity:.35;transform:scale(.65)}}
@keyframes parcelTravel{
  0%{left:19%;top:71%;transform:translate(-50%,-50%) rotate(-10deg)}
  22%{left:35%;top:62%;transform:translate(-50%,-50%) rotate(3deg)}
  48%{left:53%;top:70%;transform:translate(-50%,-50%) rotate(11deg)}
  72%{left:68%;top:50%;transform:translate(-50%,-50%) rotate(-4deg)}
  100%{left:83%;top:29%;transform:translate(-50%,-50%) rotate(8deg)}
}
@keyframes floatIcon{
  0%,100%{transform:translate3d(0,0,0) rotate(0)}
  50%{transform:translate3d(12px,-20px,0) rotate(4deg)}
}
@keyframes particle{
  0%,100%{transform:translate3d(0,0,0) scale(.7);opacity:.15}
  35%{transform:translate3d(28px,-55px,0) scale(1.25);opacity:.72}
  70%{transform:translate3d(-25px,-100px,0) scale(.55);opacity:.18}
}
@keyframes logoIn{
  from{opacity:0;transform:translateY(18px) scale(.96)}
  to{opacity:1;transform:none}
}
@keyframes rise{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:none}
}
@keyframes live{
  50%{box-shadow:0 0 0 9px rgba(0,168,166,.025),0 0 20px rgba(0,168,166,.9)}
}

@media(max-width:700px){
  .page{min-height:520px}
  .grid{background-size:44px 44px;opacity:.045}
  .frame{
    width:91vw;
    min-height:auto;
    padding:28px 18px 30px;
    border-radius:23px;
  }
  .frame:before{border-radius:17px}
  .logo-wrap{padding:10px 18px;margin-bottom:18px;border-radius:14px}
  .logo{width:min(245px,68vw);max-height:68px}
  .badge{font-size:10px;padding:7px 11px}
  h1{font-size:clamp(45px,14vw,64px);margin-top:17px}
  .lead{font-size:12px;line-height:2;margin-top:13px;max-width:300px}
  .services{margin-top:19px;gap:7px}
  .service{padding:7px 9px;font-size:9px;border-radius:10px}
  .service svg{width:15px;height:15px}
  .float-icon{width:32px;height:32px;opacity:.10}
  .parcel{width:28px;height:28px}
  .bottom-line{bottom:10px;font-size:8px}
  .cursor-ring,.cursor-dot{display:none}
}
@media(max-height:650px) and (min-width:701px){
  .frame{min-height:430px;padding-top:32px;padding-bottom:32px}
  .logo-wrap{margin-bottom:15px}
  .logo{max-height:70px}
  h1{margin-top:14px;font-size:64px}
  .lead{margin-top:11px}
  .services{margin-top:17px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<div class="cursor-ring" id="cursorRing"></div>
<div class="cursor-dot" id="cursorDot"></div>

<script>
(() => {
  const frame = document.getElementById('frame');
  const ring = document.getElementById('cursorRing');
  const dot = document.getElementById('cursorDot');
  const particles = document.getElementById('particles');

  const particleData = [
    [7,18,4,13,0,0],[13,64,3,16,2,0],[21,32,4,15,1,0],[27,80,3,14,4,1],
    [34,18,3,17,3,0],[41,75,4,13,1,0],[49,25,3,18,5,1],[57,84,4,16,0,0],
    [63,14,3,13,4,0],[70,59,4,15,2,0],[78,29,3,17,3,1],[85,73,4,14,1,0],
    [92,38,3,18,5,0],[95,16,3,13,2,1],[10,89,3,19,6,0],[89,89,3,16,4,0]
  ];
  particleData.forEach(p => {
    const el = document.createElement('i');
    el.className = 'particle' + (p[5] ? ' gold' : '');
    el.style.setProperty('--x',p[0]+'vw');
    el.style.setProperty('--y',p[1]+'vh');
    el.style.setProperty('--s',p[2]+'px');
    el.style.setProperty('--d',p[3]+'s');
    el.style.setProperty('--delay','-'+p[4]+'s');
    particles.appendChild(el);
  });

  let tx=0,ty=0,cx=0,cy=0;
  addEventListener('pointermove', e => {
    if(innerWidth <= 700) return;
    const nx=(e.clientX-innerWidth/2);
    const ny=(e.clientY-innerHeight/2);
    tx=nx/42; ty=ny/42;
    ring.style.left=e.clientX+'px';
    ring.style.top=e.clientY+'px';
    dot.style.left=e.clientX+'px';
    dot.style.top=e.clientY+'px';
  }, {passive:true});

  function animate(){
    cx += (tx-cx)*.07;
    cy += (ty-cy)*.07;
    frame.style.setProperty('--mx',cx+'px');
    frame.style.setProperty('--my',cy+'px');
    requestAnimationFrame(animate);
  }
  animate();

  frame.addEventListener('pointerenter',()=>{
    ring.style.width='44px';
    ring.style.height='44px';
    ring.style.borderColor='rgba(198,240,238,.72)';
  });
  frame.addEventListener('pointerleave',()=>{
    ring.style.width='30px';
    ring.style.height='30px';
    ring.style.borderColor='rgba(198,240,238,.38)';
  });
